plugins { id 'com.android.application' }

def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')

android {
    namespace 'ir.madreseyar.student'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.madreseyar.student'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '1.12.0'
        buildConfigField 'String', 'STUDENT_URL', '"https://scooljavanrood.ir/app/student/"'
    }

    signingConfigs {
        release {
            if (releaseKeystorePath) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            // Debug remains available for local testing only.
        }
        release {
            // GitHub Actions supplies the private signing key through encrypted secrets.
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

// Debug APK builds even without Firebase configuration, but Push will be unavailable.
// Add app/google-services.json (from Firebase Console, never commit) to activate FCM.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

dependencies {
    implementation 'com.google.firebase:firebase-messaging:24.1.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.core:core:1.13.1'
}
